name: Update Moodle Stubs

on:
  schedule:
    # Run every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      branches:
        description: 'Branch filter pattern (e.g., MOODLE_405* or * for all)'
        required: false
        default: '*'
      force:
        description: 'Force regeneration (ignore SHA tracking)'
        required: false
        type: boolean
        default: false
      skip_tags:
        description: 'Skip tag sync'
        required: false
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  STUBS_REPO_SLUG: michaelmeneses/moodle-stubs
  MOODLE_REPO: https://github.com/moodle/moodle.git
  MOODLE_CACHE_DIR: /tmp/bimoo-moodle-cache
  BIMOO_WORK_DIR: /tmp/bimoo-work

jobs:
  # ──────────────────────────────────────────────────
  # Phase 0: Prepare Moodle cache
  # ──────────────────────────────────────────────────
  prepare:
    name: Prepare Moodle cache
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Restore Moodle bare cache
        id: cache
        uses: actions/cache@v5
        with:
          path: ${{ env.MOODLE_CACHE_DIR }}
          key: moodle-bare-${{ github.run_id }}
          restore-keys: |
            moodle-bare-

      - name: Clone or fetch Moodle
        run: |
          if [ -f "${MOODLE_CACHE_DIR}/HEAD" ]; then
            echo "Cache hit — fetching updates..."
            git -C "${MOODLE_CACHE_DIR}" fetch --all --tags
          else
            echo "Cache miss — cloning bare repo..."
            git clone --bare "${MOODLE_REPO}" "${MOODLE_CACHE_DIR}"
          fi

          echo "Branches available:"
          git -C "${MOODLE_CACHE_DIR}" branch --list | wc -l

  # ──────────────────────────────────────────────────
  # Phase 1: Discover what needs updating
  # ──────────────────────────────────────────────────
  discover:
    name: Discover updates
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      branches: ${{ steps.discover.outputs.branches }}
      tags: ${{ steps.discover.outputs.tags }}
      has_branches: ${{ steps.discover.outputs.has_branches }}
      has_tags: ${{ steps.discover.outputs.has_tags }}

    steps:
      - name: Checkout moodle-stubs
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction

      - name: Discover branches and tags
        id: discover
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          STUBS_REPO="https://x-access-token:${GH_TOKEN}@github.com/${STUBS_REPO_SLUG}.git"

          FORCE_FLAG=""
          if [ "${{ inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi

          JSON=$(vendor/bin/bimoo discover:updates \
            --moodle-repo="${MOODLE_REPO}" \
            --stubs-repo="${STUBS_REPO}" \
            --stubs-repo-slug="${STUBS_REPO_SLUG}" \
            --branches="${{ inputs.branches || '*' }}" \
            $FORCE_FLAG)

          if ! echo "$JSON" | jq empty 2>/dev/null; then
            echo "::error::Invalid JSON from discover:updates: $JSON"
            exit 1
          fi

          BRANCHES=$(echo "$JSON" | jq -c '.branches')
          TAGS=$(echo "$JSON" | jq -c '.tags')

          echo "branches=${BRANCHES}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

          HAS_BRANCHES=$(echo "$BRANCHES" | jq 'length > 0')
          HAS_TAGS=$(echo "$TAGS" | jq 'length > 0')
          echo "has_branches=${HAS_BRANCHES}" >> "$GITHUB_OUTPUT"
          echo "has_tags=${HAS_TAGS}" >> "$GITHUB_OUTPUT"

          echo "Branches to update: $(echo "$BRANCHES" | jq length)"
          echo "Tags to create: $(echo "$TAGS" | jq length)"

  # ──────────────────────────────────────────────────
  # Phase 2a: Sync branches (parallel matrix)
  # ──────────────────────────────────────────────────
  sync-branch:
    name: "Branch: ${{ matrix.item.branch }}"
    needs: [prepare, discover]
    if: needs.discover.outputs.has_branches == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        item: ${{ fromJson(needs.discover.outputs.branches) }}

    steps:
      - name: Checkout moodle-stubs
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction

      - name: Restore Moodle bare cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.MOODLE_CACHE_DIR }}
          key: moodle-bare-${{ github.run_id }}
          restore-keys: |
            moodle-bare-

      - name: Configure git
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name "Bimoo Bot"
          git config --global user.email "bimoo-bot@users.noreply.github.com"
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Prepare Moodle source
        run: |
          mkdir -p "${BIMOO_WORK_DIR}"
          if [ -f "${MOODLE_CACHE_DIR}/HEAD" ]; then
            ln -s "${MOODLE_CACHE_DIR}" "${BIMOO_WORK_DIR}/moodle"
            echo "Using cached Moodle bare repo via symlink"
          else
            echo "No cache — bimoo will clone fresh"
          fi

      - name: Sync branch ${{ matrix.item.branch }}
        run: |
          vendor/bin/bimoo sync:branches \
            --stubs-repo="https://github.com/${STUBS_REPO_SLUG}.git" \
            --moodle-repo="${MOODLE_REPO}" \
            --branches="${{ matrix.item.branch }}" \
            --work-dir="${BIMOO_WORK_DIR}" \
            --force

  # ──────────────────────────────────────────────────
  # Phase 2b: Sync tags (parallel matrix per branch)
  # ──────────────────────────────────────────────────
  sync-tags:
    name: "Tags: ${{ matrix.item.branch }}"
    needs: [prepare, discover, sync-branch]
    if: |
      always() &&
      needs.discover.outputs.has_tags == 'true' &&
      inputs.skip_tags != true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        item: ${{ fromJson(needs.discover.outputs.tags) }}

    steps:
      - name: Checkout moodle-stubs
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction

      - name: Restore Moodle bare cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.MOODLE_CACHE_DIR }}
          key: moodle-bare-${{ github.run_id }}
          restore-keys: |
            moodle-bare-

      - name: Configure git
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name "Bimoo Bot"
          git config --global user.email "bimoo-bot@users.noreply.github.com"
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Prepare Moodle source
        run: |
          mkdir -p "${BIMOO_WORK_DIR}"
          if [ -f "${MOODLE_CACHE_DIR}/HEAD" ]; then
            ln -s "${MOODLE_CACHE_DIR}" "${BIMOO_WORK_DIR}/moodle"
            echo "Using cached Moodle bare repo via symlink"
          else
            echo "No cache — bimoo will clone fresh"
          fi

      - name: "Sync tags for ${{ matrix.item.branch }}"
        run: |
          vendor/bin/bimoo sync:tags \
            --stubs-repo="https://github.com/${STUBS_REPO_SLUG}.git" \
            --moodle-repo="${MOODLE_REPO}" \
            --work-dir="${BIMOO_WORK_DIR}" \
            --tags="${{ matrix.item.tags }}"

  # ──────────────────────────────────────────────────
  # Phase 3: Summary
  # ──────────────────────────────────────────────────
  summary:
    name: Summary
    needs: [discover, sync-branch, sync-tags]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: |
          echo "## Stubs Update Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branches updated: $(echo '${{ needs.discover.outputs.branches }}' | jq length)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tags created: $(echo '${{ needs.discover.outputs.tags }}' | jq length)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch sync: ${{ needs.sync-branch.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag sync: ${{ needs.sync-tags.result }}" >> "$GITHUB_STEP_SUMMARY"
